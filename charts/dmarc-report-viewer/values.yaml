# Default values for dmarc-report-viewer.

deployment:
  # -- Deployment annotations
  annotations: {}
  # -- Deployment labels
  labels: {}
  # -- Deployment replica count
  replicas: 1
  # -- Deployment revision history limit count
  revisionHistoryLimit: 1
  strategy:
    # -- Deployment strategy type
    type: RollingUpdate

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # -- This sets the registry
  registry: ghcr.io
  # -- This sets the repository
  repository: cry-inc/dmarc-report-viewer
  # -- This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# -- This is to override the chart name.
nameOverride: ""
# -- This is to override the full chart name.
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created.
  create: false
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: false
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

config:
  # -- Existing secret containing the 'imap-password' and 'http-server-password' keys.
  # If set, it is used instead of the imapPassword and httpServerPassword values.
  existingSecret: ""
  # -- IMAP host (IMAP_HOST)
  imapHost: ""
  # -- IMAP user (IMAP_USER)
  imapUser: ""
  # -- IMAP password (IMAP_PASSWORD)
  imapPassword: ""
  # -- Username for the HTTP server basic auth login (HTTP_SERVER_USER)
  httpServerUser: dmarc
  # -- Password for the HTTP server basic auth login (HTTP_SERVER_PASSWORD).
  # Use empty string to disable (not recommended).
  httpServerPassword: ""

# -- Additional environment variables for the application.
# All the supported variables can be listed with
# dmarc-report-viewer --help (see https://github.com/cry-inc/dmarc-report-viewer#configuration).
# The most common ones are IMAP_PORT (993), IMAP_STARTTLS, IMAP_FOLDER (INBOX),
# IMAP_CHECK_INTERVAL (1800), HTTP_SERVER_PORT (8080), HTTPS_AUTO_CERT and DNS_SERVER.
# If you change HTTP_SERVER_PORT, also update service.port.
env: []
# env:
# - name: IMAP_HOST
#   value: imap.mymailserver.com
# - name: IMAP_FOLDER
#   value: INBOX

# -- This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# -- Pod SecurityContext
podSecurityContext: {}
  # fsGroup: 2000

# -- SecurityContext
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # -- This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # Must match the HTTP_SERVER_PORT environment variable (8080 by default).
  port: 8080
  # -- Service ipFamilies
  ipFamilies:
  - IPv4
  # -- Service ipFamilyPolicy SingleStack|PreferDualStack|RequireDualStack
  ipFamilyPolicy: SingleStack

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # -- Ingress enabled
  enabled: false
  # -- Ingress className
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # -- HTTPRoute enabled.
  enabled: false
  # -- HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- This is to setup the liveness probe.
# More information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 30

# -- This is to setup the readiness probe.
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 30

# -- Additional volumes on the output Deployment definition.
# Use them to persist the certificate cache (HTTPS_AUTO_CERT_CACHE) or to provide
# additional TLS root certificates (IMAP_TLS_CA_CERTS).
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# -- Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

# -- This sets the nodeSelector labels
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity
affinity: {}
