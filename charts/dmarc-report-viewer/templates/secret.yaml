{{- if and (eq .Values.config.existingSecret "") (or .Values.config.imapPassword .Values.config.httpServerPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmarc-report-viewer.fullname" . }}
  labels:
    {{- include "dmarc-report-viewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  imap-password: {{ .Values.config.imapPassword | quote }}
  http-server-password: {{ .Values.config.httpServerPassword | quote }}
{{- end }}
